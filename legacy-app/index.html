<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SHG Task Manager — task and team management" />
    <meta name="theme-color" content="#10233f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SHG Task Manager" />
    <title>SHG Task Manager</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/app-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=232" />
  </head>
  <body>
    <div class="app-shell">
      <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">‹</button>
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-logo" src="icons/mailo-logo.jpeg" alt="Mailo" />
        </div>

        <button id="newTaskBtn" class="sidebar-new-task" type="button"><span>+</span> New task</button>
        <button id="miniTaskBtn" class="sidebar-new-task sidebar-mini-task" type="button"><span>+</span> Mini Task</button>

        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-item" data-view="board"><span>▦</span> Tasks</button>
          <button class="nav-item active" data-view="overview"><span>⌂</span> Overview</button>
          <button class="nav-item admin-only" data-view="users"><span>♟</span> Users</button>
          <button class="nav-item admin-only" data-view="spaces"><span>◆</span> Spaces</button>
          <button class="nav-item admin-only" data-view="activity"><span>≣</span> Activity Log</button>
        </nav>

        <button class="project-item all-tasks-item active" data-project="all"><i style="--dot:#75829a"></i> All Tasks <span id="allCount">0</span></button>
        <div class="sidebar-section">
          <div id="projectList"></div>
        </div>

        <div id="sidebarUserMenu" class="sidebar-user-menu hidden" role="menu">
          <button id="logoutBtn" type="button" role="menuitem"><span>↪</span> Logout</button>
        </div>
        <button id="sidebarUserButton" class="sidebar-footer" type="button" aria-haspopup="menu" aria-expanded="false">
          <div id="currentUserAvatar" class="avatar">VS</div>
          <div class="user-meta"><strong id="currentUserName">Victor Stavropoulos</strong><span id="roleLabel">Administrator</span></div>
          <span class="dots" aria-hidden="true">•••</span>
        </button>
      </aside>

      <main>
        <header class="topbar">
          <div class="mobile-brand">SHG <span>Task Manager</span></div>
          <div class="search-wrap"><span>⌕</span><input id="searchInput" placeholder="Search tasks…" /></div>
          <div class="top-actions">
            <button class="data-transfer-btn main-admin-only" type="button" onclick="exportApplicationData()">Export Data</button>
            <button class="data-transfer-btn main-admin-only" type="button" onclick="document.getElementById('applicationDataImport').click()">Import Data</button>
            <input id="applicationDataImport" class="hidden" type="file" accept="application/json,.json" onchange="importApplicationData(this)">
            <label class="user-preview-switcher main-admin-only">View as User
              <select id="userPreviewSelect"></select>
            </label>
          </div>
        </header>

        <section class="content">
          <div id="tasksContent">
          <div class="page-head">
            <div><p class="eyebrow">WORKSPACE / <span id="projectCrumb">ALL SPACES</span></p><h1>Tasks</h1><p class="subtitle">Organise, assign and track every task.</p></div>
            <button id="mobileNewTaskBtn" class="primary-btn mobile-new-task"><span>+</span> New task</button>
          </div>

          <div class="toolbar">
            <div class="view-tabs"><button id="listTab" class="active">List</button><button id="calendarTab">Calendar</button><button id="progressLogTab">In Progress Log</button></div>
            <div class="filters">
              <button id="rollOverdueBtn" class="filter-btn admin-only" type="button">Roll Overdue to Monday</button>
              <label class="filter-btn toggle-filter"><input id="includeDoneFilter" type="checkbox"> Include Done</label>
              <label class="filter-btn toggle-filter"><input id="unfoldSubtasksFilter" type="checkbox" checked> Unfold Subtasks</label>
              <label class="filter-btn toggle-filter"><input id="sortSubtasksFilter" type="checkbox"> Sort Subtasks Individually</label>
              <label class="filter-btn toggle-filter"><input id="viewMiniTasksFilter" type="checkbox"> View Mini Tasks</label>
              <label class="filter-btn toggle-filter"><input id="viewCancelledFilter" type="checkbox"> View Cancelled</label>
              <label class="filter-btn toggle-filter"><input id="viewDoneFilter" type="checkbox"> View Done</label>
              <select id="assigneeFilter" class="filter-btn admin-only" aria-label="Filter by assignee"><option value="all">All assignees</option></select>
              <button id="myTasksFilter" class="filter-btn">◎ My tasks</button>
            </div>
          </div>

          <div id="listView" class="list-view" aria-live="polite"></div>
          <div id="calendarView" class="calendar-view hidden" aria-live="polite"></div>
          <div id="progressLogView" class="progress-log-view hidden" aria-live="polite"></div>
          </div>
          <div id="usersView" class="users-view hidden" aria-live="polite"></div>
          <div id="spacesView" class="users-view hidden" aria-live="polite"></div>
          <div id="overviewView" class="overview-view hidden" aria-live="polite"></div>
          <div id="activityView" class="activity-view hidden" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <div id="modalBackdrop" class="modal-backdrop hidden">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button id="closeModal" class="close-btn" aria-label="Close">×</button>
        <div id="modalContent"></div>
        <footer id="taskDetailsFooter" class="task-details-footer hidden"></footer>
      </section>
    </div>

    <div id="toast" class="toast"></div>
    <div id="authGate" class="auth-gate hidden" aria-live="polite">
      <section class="auth-card" aria-labelledby="authTitle">
        <div class="auth-brand"><span>S</span><div><strong>SHG</strong><small>Task Manager</small></div></div>
        <h1 id="authTitle">Sign in</h1>
        <p id="authMessage">Enter your company email and we will send you an 8-digit verification code.</p>
        <form id="authEmailForm">
          <label for="authEmail">Email</label>
          <input id="authEmail" type="email" autocomplete="email" required placeholder="name@shd.global" />
          <button id="sendOtpBtn" type="submit">Send verification code</button>
        </form>
        <form id="authOtpForm" class="hidden">
          <button id="changeAuthEmail" class="auth-back" type="button">← Change email</button>
          <label for="authOtp">8-digit code</label>
          <input id="authOtp" type="text" inputmode="numeric" autocomplete="one-time-code" minlength="8" maxlength="8" pattern="[0-9]{8}" required placeholder="00000000" />
          <button id="verifyOtpBtn" type="submit">Verify and sign in</button>
          <button id="resendOtpBtn" class="auth-secondary" type="button">Send a new code</button>
        </form>
        <p id="authError" class="auth-error hidden"></p>
      </section>
    </div>
    <script src="bootstrap-data.js"></script>
    <script src="auth.js?v=222"></script>
    <script src="remote-sync.js?v=232"></script>
    <script>
      (async () => {
        try {
          await window.shgPrepareRemoteData?.();
        } catch (error) {
          console.error('Could not load shared SHG data', error);
          window.SHG_REMOTE_LOAD_ERROR = error;
        }
        const scripts = [
          'jira-tasks.js',
          'victor-main-filter.js',
          ...Array.from({ length: 16 }, (_, index) => `jira-comments-${String(index + 1).padStart(2, '0')}.js`),
          'app.js?v=232',
        ];
        for (const source of scripts) {
          await new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = source;
            script.onload = resolve;
            script.onerror = reject;
            document.body.appendChild(script);
          });
        }
        window.SHG_APP_LOADED = true;
        if (window.SHG_REMOTE_LOAD_ERROR && typeof window.toast === 'function') {
          window.toast(`The shared database is temporarily unavailable. Retrying automatically. ${window.SHG_REMOTE_LOAD_ERROR.message || ''}`.trim());
        }
        window.addEventListener('shg:remote-error', event => {
          if (typeof window.toast === 'function') {
            window.toast(event.detail?.message || 'The shared database could not save the latest change.');
          }
        });
      })();
    </script>
    <script>
      (() => {
        const userButton = document.getElementById('sidebarUserButton');
        const userMenu = document.getElementById('sidebarUserMenu');
        const logoutButton = document.getElementById('logoutBtn');
        if (!userButton || !userMenu || !logoutButton) return;

        userButton.addEventListener('click', event => {
          event.stopPropagation();
          const opening = userMenu.classList.contains('hidden');
          userMenu.classList.toggle('hidden', !opening);
          userButton.setAttribute('aria-expanded', String(opening));
        });

        logoutButton.addEventListener('click', event => {
          event.stopPropagation();
          window.shgLogout?.();
        });

        document.addEventListener('click', event => {
          if (!userMenu.contains(event.target) && !userButton.contains(event.target)) {
            userMenu.classList.add('hidden');
            userButton.setAttribute('aria-expanded', 'false');
          }
        });
      })();
    </script>
  </body>
</html>
